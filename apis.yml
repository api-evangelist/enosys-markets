name: Enosys Markets
description: "Ēnosys (formerly Flare Finance) is a decentralized finance (DeFi)\
  \ platform building on the Flare and Songbird networks. Its product suite spans DEX\
  \ V2 and V3 automated market makers with liquidity provision, collateralized Loans,\
  \ yield Farms with a token launchpad, a cross-chain Bridge, DeFi price Oracles built\
  \ on the Flare Time Series Oracle (FTSO), the Skopos blockchain indexer, Oryy multi-signature\
  \ self-custody vaults, and an NFT suite (Gallery, Ermis, Clover). Enosys interfaces\
  \ are smart-contract based rather than a conventional REST API; developer integration\
  \ happens through published Solidity contracts, subgraphs, and price-feed connectors\
  \ in the flrfinance GitHub organization."
